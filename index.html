<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏀 BASKET SHOT - Căn Lực</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% 10%,#394d72 0%,#151c2e 45%,#080b13 100%);
    color:white;
    min-height:100vh;
    overflow:hidden;
}

button{
    font-family:inherit;
    cursor:pointer;
}

#app{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#game{
    position:relative;
    width:min(1100px,100vw);
    height:min(680px,100vh);
    overflow:hidden;
    background:linear-gradient(#88c9ed 0%,#bde8ff 56%,#d99a58 56%,#8b542e 100%);
    box-shadow:0 0 50px rgba(0,0,0,.55);
}

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    touch-action:none;
}

/* ================= HUD ================= */

#hud{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    z-index:10;
    pointer-events:none;
}

.hudBox{
    background:rgba(8,13,25,.82);
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    padding:8px 13px;
    min-width:105px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.hudTitle{
    font-size:10px;
    opacity:.65;
    text-transform:uppercase;
}

.hudValue{
    font-size:21px;
    font-weight:900;
    margin-top:2px;
}

#comboBox{
    border-color:#ffb52e;
}

#comboValue{
    color:#ffc83d;
}

/* ================= AIM INFO ================= */

#aimInfo{
    position:absolute;
    left:50%;
    bottom:125px;
    transform:translateX(-50%);
    z-index:10;
    width:min(460px,calc(100% - 30px));
    text-align:center;
    pointer-events:none;
}

#aimPanel{
    display:inline-block;
    padding:10px 18px;
    border-radius:14px;
    background:rgba(7,12,23,.82);
    border:1px solid rgba(255,255,255,.14);
}

#aimText{
    font-size:14px;
    font-weight:bold;
}

#difficulty{
    margin-top:4px;
    color:#ffc43d;
    font-size:12px;
}

/* ================= POWER BAR ================= */

#powerWrap{
    position:absolute;
    left:50%;
    bottom:67px;
    transform:translateX(-50%);
    width:min(500px,calc(100% - 40px));
    z-index:10;
    pointer-events:none;
}

#powerBar{
    height:17px;
    border-radius:20px;
    overflow:hidden;
    background:rgba(0,0,0,.55);
    border:2px solid rgba(255,255,255,.35);
    box-shadow:0 3px 10px rgba(0,0,0,.3);
}

#powerFill{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#34d27b,#ffd447,#ff7048);
    transition:width .03s linear;
}

#powerTarget{
    position:absolute;
    top:-4px;
    height:25px;
    width:4px;
    background:white;
    box-shadow:0 0 8px white;
}

/* ================= START SCREEN ================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(5,8,15,.72);
    backdrop-filter:blur(8px);
}

.panel{
    width:min(480px,calc(100% - 30px));
    background:linear-gradient(145deg,#17233a,#0e1525);
    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;
    padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    text-align:center;
}

.logo{
    font-size:58px;
    margin-bottom:5px;
    filter:drop-shadow(0 5px 5px rgba(0,0,0,.4));
}

h1{
    font-size:34px;
    font-weight:1000;
    letter-spacing:1px;
}

.subtitle{
    color:#9eb1ca;
    margin-top:5px;
    margin-bottom:23px;
}

input{
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    border:1px solid #34445e;
    outline:none;
    background:#080e1b;
    color:white;
    font-size:16px;
    text-align:center;
    margin-bottom:12px;
}

input:focus{
    border-color:#4aa9ff;
}

.mainBtn{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    font-size:17px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#ff9d20,#ff5c36);
    box-shadow:0 7px 20px rgba(255,100,40,.25);
    transition:.15s;
}

.mainBtn:hover{
    transform:translateY(-2px);
}

.secondaryBtn{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:1px solid #34445e;
    border-radius:12px;
    color:white;
    background:#18243a;
    font-weight:bold;
}

/* ================= RANKING ================= */

#rankingPanel{
    display:none;
}

.rankList{
    max-height:330px;
    overflow:auto;
    margin-top:15px;
}

.rankRow{
    display:grid;
    grid-template-columns:45px 1fr 100px;
    align-items:center;
    gap:8px;
    padding:10px 8px;
    margin-bottom:6px;
    border-radius:10px;
    background:rgba(255,255,255,.055);
}

.rankNumber{
    font-weight:900;
    color:#ffc83d;
}

.rankName{
    text-align:left;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rankScore{
    text-align:right;
    font-weight:900;
}

/* ================= RESULT ================= */

#resultOverlay{
    display:none;
}

.bigScore{
    font-size:48px;
    font-weight:1000;
    color:#ffd34e;
    margin:8px 0;
}

.resultStats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:15px 0;
}

.stat{
    background:rgba(255,255,255,.06);
    border-radius:12px;
    padding:10px;
}

.stat small{
    opacity:.55;
}

.stat b{
    display:block;
    font-size:19px;
    margin-top:3px;
}

/* ================= MESSAGE ================= */

#message{
    position:absolute;
    top:115px;
    left:50%;
    transform:translateX(-50%);
    z-index:15;
    pointer-events:none;
    font-size:30px;
    font-weight:1000;
    text-shadow:0 4px 10px rgba(0,0,0,.5);
    opacity:0;
    white-space:nowrap;
}

.messageAnim{
    animation:messagePop .8s ease forwards;
}

@keyframes messagePop{
    0%{
        opacity:0;
        transform:translate(-50%,20px) scale(.6);
    }
    20%{
        opacity:1;
        transform:translate(-50%,0) scale(1.15);
    }
    75%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-50%,-45px) scale(1);
    }
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    #game{
        height:100vh;
    }

    .hudBox{
        min-width:0;
        flex:1;
        padding:6px 5px;
    }

    .hudValue{
        font-size:17px;
    }

    .hudTitle{
        font-size:8px;
    }

    #aimInfo{
        bottom:105px;
    }

    #powerWrap{
        bottom:58px;
    }

    .panel{
        padding:22px;
    }

    h1{
        font-size:27px;
    }

    .logo{
        font-size:48px;
    }
}
</style>
</head>

<body>

<div id="app">

<div id="game">

<canvas id="canvas"></canvas>

<!-- HUD -->
<div id="hud">

    <div class="hudBox">
        <div class="hudTitle">Điểm</div>
        <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox" id="comboBox">
        <div class="hudTitle">Chuỗi</div>
        <div class="hudValue" id="comboValue">0×</div>
    </div>

    <div class="hudBox">
        <div class="hudTitle">Hệ số</div>
        <div class="hudValue" id="multiplier">1×</div>
    </div>

    <div class="hudBox">
        <div class="hudTitle">Cú ném</div>
        <div class="hudValue"><span id="shots">0</span>/<span id="maxShots">20</span></div>
    </div>

</div>

<div id="message"></div>

<!-- Aim info -->
<div id="aimInfo">
    <div id="aimPanel">
        <div id="aimText">Kéo bóng để căn hướng + lực</div>
        <div id="difficulty">Độ khó: DỄ</div>
    </div>
</div>

<!-- Power -->
<div id="powerWrap">
    <div id="powerBar">
        <div id="powerFill"></div>
    </div>
</div>

<!-- START -->
<div class="overlay" id="startOverlay">

    <div class="panel">

        <div class="logo">🏀</div>

        <h1>BASKET SHOT</h1>

        <div class="subtitle">
            Căn lực • Ném bóng • Tạo chuỗi
        </div>

        <input
            id="playerName"
            maxlength="16"
            placeholder="Nhập tên của bạn..."
            autocomplete="off"
        >

        <button class="mainBtn" id="startBtn">
            BẮT ĐẦU CHƠI
        </button>

        <button class="secondaryBtn" id="rankBtn">
            🏆 XEM BẢNG XẾP HẠNG
        </button>

    </div>

</div>

<!-- RANKING -->
<div class="overlay" id="rankingOverlay">

    <div class="panel">

        <div class="logo">🏆</div>

        <h1>BẢNG XẾP HẠNG</h1>

        <div class="subtitle">
            Top điểm cao nhất trên thiết bị này
        </div>

        <div class="rankList" id="rankList"></div>

        <button class="secondaryBtn" id="closeRank">
            QUAY LẠI
        </button>

    </div>

</div>

<!-- RESULT -->
<div class="overlay" id="resultOverlay">

    <div class="panel">

        <div class="logo">🏀</div>

        <h1>KẾT THÚC</h1>

        <div class="bigScore" id="finalScore">0</div>

        <div id="finalName" style="opacity:.7"></div>

        <div class="resultStats">

            <div class="stat">
                <small>Chuỗi cao nhất</small>
                <b id="bestCombo">0×</b>
            </div>

            <div class="stat">
                <small>Độ chính xác</small>
                <b id="accuracy">0%</b>
            </div>

        </div>

        <button class="mainBtn" id="againBtn">
            CHƠI LẠI
        </button>

        <button class="secondaryBtn" id="resultRankBtn">
            🏆 XEM BXH
        </button>

    </div>

</div>

</div>
</div>

<script>
/* =========================================================
   BASKET SHOT
   Game ném bóng căn lực
   Chạy độc lập trên GitHub Pages
========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 1100;
let H = 680;

function resizeCanvas(){

    const rect = canvas.getBoundingClientRect();

    W = rect.width;
    H = rect.height;

    const dpr = Math.min(window.devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeCanvas);
resizeCanvas();

/* ================= GAME VARIABLES ================= */

const MAX_SHOTS = 20;

let gameStarted = false;
let gameOver = false;

let score = 0;
let combo = 0;
let bestCombo = 0;
let shots = 0;
let madeShots = 0;

let playerName = "";

let aimX = 0;
let aimY = 0;
let power = 0;

let dragging = false;
let charging = false;

let ball = {
    x:0,
    y:0,
    vx:0,
    vy:0,
    r:14,
    flying:false,
    scored:false,
    trail:[]
};

let hoop = {
    x:0,
    y:0,
    width:130,
    height:10
};

let target = {
    x:0,
    y:0,
    width:80,
    height:70
};

let particles = [];

let wind = 0;
let difficulty = 1;

/* ================= AUDIO ================= */

let audioCtx = null;

function beep(freq=500,duration=.08,type="sine"){

    try{

        if(!audioCtx){
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.value = freq;

        gain.gain.setValueAtTime(.05,audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime+duration);

    }catch(e){}
}

/* ================= HELPERS ================= */

function clamp(v,min,max){
    return Math.max(min,Math.min(max,v));
}

function rand(min,max){
    return Math.random()*(max-min)+min;
}

function lerp(a,b,t){
    return a+(b-a)*t;
}

/* ================= DIFFICULTY ================= */

function updateDifficulty(){

    difficulty = Math.min(10,1 + Math.floor(combo/2));

    /*
        Combo 0-1  : dễ
        Combo 2-3  : mức 2
        Combo 4-5  : mức 3
        ...
        Combo 18+  : mức 10
    */

    const baseWidth = 135;

    hoop.width = clamp(
        baseWidth - (difficulty-1)*9,
        60,
        135
    );

    /*
       Rổ di chuyển nhiều hơn ở combo cao
    */

    hoop.x = lerp(
        W*.72,
        W*.82,
        Math.random()
    );

    hoop.y = H*.36 + rand(
        -difficulty*3,
        difficulty*3
    );

    /*
       Gió tăng theo độ khó
    */

    wind = difficulty >= 3
        ? rand(-0.025*difficulty,0.025*difficulty)
        : 0;

    /*
       Mục tiêu căn lực nhỏ dần
    */

    target.width = clamp(
        110 - difficulty*7,
        35,
        110
    );

    target.height = clamp(
        90 - difficulty*5,
        40,
        90
    );

    let text = "DỄ";

    if(difficulty === 2) text = "BÌNH THƯỜNG";
    if(difficulty === 3) text = "KHÓ";
    if(difficulty === 4) text = "RẤT KHÓ";
    if(difficulty >= 5) text = "ĐIÊN";

    document.getElementById("difficulty").textContent =
        "Độ khó: " + text +
        (wind !== 0 ? " • 💨 Gió" : "");
}

/* ================= RESET BALL ================= */

function resetBall(){

    ball.x = W*.17;
    ball.y = H*.75;

    ball.vx = 0;
    ball.vy = 0;

    ball.flying = false;
    ball.scored = false;
    ball.trail = [];

    aimX = hoop.x-ball.x;
    aimY = hoop.y-ball.y;

    power = 0;

    updatePowerUI();
}

/* ================= START GAME ================= */

function startGame(){

    playerName =
        document.getElementById("playerName").value.trim();

    if(!playerName){
        playerName = "Người chơi";
    }

    score = 0;
    combo = 0;
    bestCombo = 0;
    shots = 0;
    madeShots = 0;

    gameStarted = true;
    gameOver = false;

    document.getElementById("startOverlay").style.display="none";
    document.getElementById("resultOverlay").style.display="none";

    updateHUD();

    updateDifficulty();

    resetBall();

    beep(500,.1);
}

/* ================= HUD ================= */

function updateHUD(){

    document.getElementById("score").textContent =
        score.toLocaleString("vi-VN");

    document.getElementById("comboValue").textContent =
        combo + "×";

    document.getElementById("multiplier").textContent =
        Math.max(1,Math.floor(1+combo*.5)) + "×";

    document.getElementById("shots").textContent =
        shots;

    document.getElementById("maxShots").textContent =
        MAX_SHOTS;
}

/* ================= POWER ================= */

function calculatePower(){

    /*
       power chạy 0 -> 100 -> 0.
       50 là mức dễ kiểm soát.
    */

    const time = performance.now()/1000;

    let cycle = (Math.sin(time*2.7)+1)/2;

    power = cycle*100;

    updatePowerUI();
}

function updatePowerUI(){

    document.getElementById("powerFill").style.width =
        power+"%";

    /*
       vùng mục tiêu thay đổi theo độ khó
    */

    let center =
        65 - difficulty*1.5;

    let width =
        Math.max(7,20-difficulty);

    document.getElementById("powerTarget").style.left =
        (center-width/2)+"%";
}

/* ================= SHOOT ================= */

function shoot(){

    if(!gameStarted || gameOver) return;

    if(ball.flying) return;

    if(shots >= MAX_SHOTS){
        endGame();
        return;
    }

    shots++;

    /*
       Tính hướng dựa vào vị trí rê chuột
    */

    let dx = aimX;
    let dy = aimY;

    const distance =
        Math.sqrt(dx*dx+dy*dy);

    let nx = dx/distance;
    let ny = dy/distance;

    /*
       Power càng cao thì vận tốc càng lớn.
       Điều chỉnh để bóng có quỹ đạo đẹp.
    */

    const minSpeed = 12;
    const maxSpeed = 22;

    const speed =
        minSpeed + (power/100)*(maxSpeed-minSpeed);

    ball.vx = nx*speed;
    ball.vy = ny*speed;

    /*
       Gió tác động lên bóng
    */

    ball.vx += wind*40;

    ball.flying = true;
    ball.scored = false;
    ball.trail = [];

    beep(250,.06,"triangle");

    updateHUD();
}

/* ================= SCORE ================= */

function scoreBasket(){

    if(ball.scored) return;

    ball.scored = true;
    madeShots++;

    combo++;

    bestCombo =
        Math.max(bestCombo,combo);

    /*
       Hệ số tăng theo combo
    */

    const multiplier =
        Math.max(1,Math.floor(1+combo*.5));

    /*
       Điểm cơ bản phụ thuộc độ khó.
       Combo càng cao điểm càng nhiều.
    */

    const base =
        100 + difficulty*25;

    const bonus =
        Math.round(base*multiplier);

    score += bonus;

    createParticles(
        hoop.x,
        hoop.y,
        "#ffd34e",
        25
    );

    showMessage(
        "🔥 +" + bonus +
        " ĐIỂM • COMBO " + combo
    );

    beep(600 + combo*35,.12,"square");

    updateDifficulty();
    updateHUD();

    setTimeout(()=>{

        if(!gameOver){
            resetBall();
        }

    },650);
}

/* ================= MISS ================= */

function missBasket(){

    if(gameOver) return;

    combo = 0;

    showMessage("❌ TRƯỢT!");

    beep(130,.16,"sawtooth");

    updateDifficulty();
    updateHUD();

    setTimeout(()=>{

        if(!gameOver){
            resetBall();
        }

    },600);
}

/* ================= END GAME ================= */

function endGame(){

    gameOver = true;

    saveScore();

    document.getElementById("finalScore").textContent =
        score.toLocaleString("vi-VN");

    document.getElementById("finalName").textContent =
        playerName;

    document.getElementById("bestCombo").textContent =
        bestCombo+"×";

    const acc =
        shots > 0
        ? Math.round(madeShots/shots*100)
        : 0;

    document.getElementById("accuracy").textContent =
        acc+"%";

    document.getElementById("resultOverlay").style.display =
        "flex";

    beep(180,.3,"sine");
}

/* ================= RANKING ================= */

function getRanking(){

    try{

        return JSON.parse(
            localStorage.getItem("basketShotRanking") || "[]"
        );

    }catch(e){

        return [];
    }
}

function saveScore(){

    let ranking = getRanking();

    ranking.push({
        name:playerName,
        score:score,
        combo:bestCombo,
        date:new Date().toLocaleDateString("vi-VN")
    });

    ranking.sort((a,b)=>b.score-a.score);

    ranking = ranking.slice(0,20);

    localStorage.setItem(
        "basketShotRanking",
        JSON.stringify(ranking)
    );
}

function showRanking(){

    const ranking = getRanking();

    const list =
        document.getElementById("rankList");

    list.innerHTML = "";

    if(ranking.length===0){

        list.innerHTML = `
            <div style="
                padding:30px;
                opacity:.55;
            ">
                Chưa có dữ liệu.<br>
                Hãy trở thành người đầu tiên!
            </div>
        `;

    }else{

        ranking.forEach((item,index)=>{

            let medal = "";

            if(index===0) medal="🥇";
            else if(index===1) medal="🥈";
            else if(index===2) medal="🥉";
            else medal="#"+(index+1);

            list.innerHTML += `
                <div class="rankRow">
                    <div class="rankNumber">${medal}</div>

                    <div class="rankName">
                        ${escapeHTML(item.name)}
                    </div>

                    <div class="rankScore">
                        ${Number(item.score).toLocaleString("vi-VN")}
                    </div>
                </div>
            `;

        });
    }

    document.getElementById("startOverlay").style.display="none";
    document.getElementById("resultOverlay").style.display="none";
    document.getElementById("rankingOverlay").style.display="flex";
}

function escapeHTML(str){

    return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

/* ================= MESSAGE ================= */

function showMessage(text){

    const el =
        document.getElementById("message");

    el.textContent = text;

    el.classList.remove("messageAnim");

    void el.offsetWidth;

    el.classList.add("messageAnim");
}

/* ================= PARTICLES ================= */

function createParticles(x,y,type,count){

    for(let i=0;i<count;i++){

        particles.push({

            x:x,
            y:y,

            vx:rand(-5,5),
            vy:rand(-7,-2),

            life:1,

            size:rand(2,6),

            type:type
        });
    }
}

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .2;

        p.life -= .025;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha = p.life;

        ctx.fillStyle = p.type;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* ================= DRAW BACKGROUND ================= */

function drawBackground(){

    /*
       Bầu trời
    */

    const sky =
        ctx.createLinearGradient(0,0,0,H*.6);

    sky.addColorStop(0,"#67b9e8");
    sky.addColorStop(1,"#d7f3ff");

    ctx.fillStyle = sky;

    ctx.fillRect(0,0,W,H*.6);

    /*
       Mây
    */

    ctx.fillStyle="rgba(255,255,255,.55)";

    for(let i=0;i<5;i++){

        let x =
            ((i*260 + performance.now()*.01) %
            (W+250))-120;

        let y =
            70+(i%3)*50;

        ctx.beginPath();

        ctx.arc(x,y,25,0,Math.PI*2);
        ctx.arc(x+30,y-12,35,0,Math.PI*2);
        ctx.arc(x+65,y,25,0,Math.PI*2);

        ctx.fill();
    }

    /*
       Sàn
    */

    ctx.fillStyle="#b97842";

    ctx.fillRect(0,H*.6,W,H*.4);

    /*
       Sàn gỗ
    */

    ctx.strokeStyle="rgba(60,30,15,.22)";
    ctx.lineWidth=2;

    for(let y=H*.6;y<H;y+=35){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();
    }

    for(let x=0;x<W;x+=90){

        ctx.beginPath();

        ctx.moveTo(x,H*.6);
        ctx.lineTo(x+35,H);

        ctx.stroke();
    }

    /*
       Sân
    */

    ctx.strokeStyle="rgba(255,255,255,.65)";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
        W*.65,
        H*.75,
        100,
        Math.PI,
        Math.PI*2
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(W*.5,H*.6);
    ctx.lineTo(W*.5,H);

    ctx.stroke();
}

/* ================= DRAW HOOP ================= */

function drawHoop(){

    /*
       Backboard
    */

    const boardX = hoop.x+hoop.width*.1;
    const boardY = hoop.y-80;

    ctx.fillStyle="rgba(245,250,255,.92)";

    ctx.fillRect(
        boardX,
        boardY,
        hoop.width*.85,
        75
    );

    ctx.strokeStyle="#263342";
    ctx.lineWidth=5;

    ctx.strokeRect(
        boardX,
        boardY,
        hoop.width*.85,
        75
    );

    /*
       Inner board square
    */

    ctx.strokeStyle="#ef4b35";
    ctx.lineWidth=4;

    ctx.strokeRect(
        boardX+hoop.width*.2,
        boardY+18,
        hoop.width*.45,
        40
    );

    /*
       Hoop
    */

    ctx.strokeStyle="#f04b32";
    ctx.lineWidth=8;

    ctx.beginPath();

    ctx.ellipse(
        hoop.x,
        hoop.y,
        hoop.width/2,
        7,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();

    /*
       Net
    */

    ctx.strokeStyle="rgba(255,255,255,.85)";
    ctx.lineWidth=2;

    for(let i=-4;i<=4;i++){

        ctx.beginPath();

        ctx.moveTo(
            hoop.x+i*hoop.width/10,
            hoop.y+5
        );

        ctx.lineTo(
            hoop.x+i*hoop.width/16,
            hoop.y+45
        );

        ctx.stroke();
    }

    for(let i=0;i<4;i++){

        ctx.beginPath();

        ctx.moveTo(
            hoop.x-hoop.width*.35,
            hoop.y+12+i*8
        );

        ctx.lineTo(
            hoop.x+hoop.width*.35,
            hoop.y+12+i*8
        );

        ctx.stroke();
    }

    /*
       Cột
    */

    ctx.fillStyle="#424c5a";

    ctx.fillRect(
        hoop.x-8,
        hoop.y+3,
        16,
        H-hoop.y
    );
}

/* ================= DRAW BALL ================= */

function drawBall(){

    /*
       Trail
    */

    for(let i=0;i<ball.trail.length;i++){

        const t =
            ball.trail[i];

        ctx.globalAlpha =
            (i/ball.trail.length)*.25;

        ctx.fillStyle="#e87525";

        ctx.beginPath();

        ctx.arc(
            t.x,
            t.y,
            ball.r*.7,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    /*
       Bóng
    */

    const gradient =
        ctx.createRadialGradient(
            ball.x-5,
            ball.y-6,
            2,
            ball.x,
            ball.y,
            ball.r
        );

    gradient.addColorStop(0,"#ffb14c");
    gradient.addColorStop(1,"#d94818");

    ctx.fillStyle=gradient;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Đường bóng
    */

    ctx.strokeStyle="rgba(70,25,10,.8)";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r*.65,
        -.7,
        .7
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r*.65,
        2.44,
        3.84
    );

    ctx.stroke();
}

/* ================= AIM GUIDE ================= */

function drawAimGuide(){

    if(ball.flying || !gameStarted) return;

    /*
       Đường ngắm
    */

    const dx =
        aimX;

    const dy =
        aimY;

    const distance =
        Math.sqrt(dx*dx+dy*dy);

    if(distance<10) return;

    const nx = dx/distance;
    const ny = dy/distance;

    const length =
        80 + power*1.2;

    ctx.strokeStyle="rgba(255,255,255,.65)";
    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);

    ctx.beginPath();

    ctx.moveTo(
        ball.x,
        ball.y
    );

    ctx.lineTo(
        ball.x+nx*length,
        ball.y+ny*length
    );

    ctx.stroke();

    ctx.setLineDash([]);

    /*
       Mũi tên
    */

    const ex =
        ball.x+nx*length;

    const ey =
        ball.y+ny*length;

    ctx.fillStyle="rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.arc(ex,ey,6,0,Math.PI*2);

    ctx.fill();
}

/* ================= DRAW ================= */

function draw(){

    ctx.clearRect(0,0,W,H);

    drawBackground();

    drawHoop();

    drawAimGuide();

    drawBall();

    drawParticles();
}

/* ================= PHYSICS ================= */

function updatePhysics(){

    if(!ball.flying) return;

    /*
       Lưu trail
    */

    ball.trail.push({
        x:ball.x,
        y:ball.y
    });

    if(ball.trail.length>12){
        ball.trail.shift();
    }

    /*
       Trọng lực
    */

    ball.vy += .42;

    /*
       Gió
    */

    ball.vx += wind*.12;

    /*
       Di chuyển
    */

    ball.x += ball.vx;
    ball.y += ball.vy;

    /*
       Kiểm tra bóng đi qua mặt rổ
    */

    const rimLeft =
        hoop.x-hoop.width/2;

    const rimRight =
        hoop.x+hoop.width/2;

    const rimY =
        hoop.y;

    /*
       Nếu bóng đi xuống qua rổ
    */

    if(
        !ball.scored &&
        ball.vy>0 &&
        ball.y>=rimY-4 &&
        ball.y<=rimY+15 &&
        ball.x>rimLeft+ball.r*.35 &&
        ball.x<rimRight-ball.r*.35
    ){

        scoreBasket();

        return;
    }

    /*
       Va chạm vành trái
    */

    const leftDistance =
        Math.abs(ball.x-rimLeft);

    const rightDistance =
        Math.abs(ball.x-rimRight);

    if(
        ball.y>rimY-ball.r &&
        ball.y<rimY+15 &&
        (
            leftDistance<ball.r ||
            rightDistance<ball.r
        )
    ){

        ball.vx *= -0.72;
        ball.vy *= .72;

        ball.x += ball.vx*.4;
    }

    /*
       Va chạm mặt đất
    */

    if(ball.y>H*.87){

        ball.y=H*.87;

        ball.vy *= -.45;
        ball.vx *= .75;

        if(Math.abs(ball.vy)<2){

            missBasket();
        }
    }

    /*
       Ra khỏi màn hình
    */

    if(
        ball.x<-100 ||
        ball.x>W+100 ||
        ball.y>H+100
    ){

        missBasket();
    }
}

/* ================= GAME LOOP ================= */

function loop(){

    if(gameStarted && !gameOver){

        calculatePower();

        updatePhysics();
    }

    updateParticles();

    draw();

    requestAnimationFrame(loop);
}

loop();

/* ================= INPUT ================= */

function getPointer(e){

    const rect =
        canvas.getBoundingClientRect();

    return {
        x:e.clientX-rect.left,
        y:e.clientY-rect.top
    };
}

canvas.addEventListener("pointerdown",e=>{

    if(!gameStarted || gameOver) return;

    if(ball.flying) return;

    dragging=true;
    charging=true;

    canvas.setPointerCapture(e.pointerId);

    const p=getPointer(e);

    aimX =
        p.x-ball.x;

    aimY =
        p.y-ball.y;
});

canvas.addEventListener("pointermove",e=>{

    if(!dragging) return;

    const p=getPointer(e);

    /*
       Giới hạn hướng ngắm
    */

    aimX =
        clamp(
            p.x-ball.x,
            -200,
            700
        );

    aimY =
        clamp(
            p.y-ball.y,
            -550,
            300
        );

    /*
       Power dựa vào độ kéo.
       Càng kéo xa càng mạnh.
    */

    const distance =
        Math.sqrt(
            aimX*aimX+
            aimY*aimY
        );

    power =
        clamp(
            distance/5,
            0,
            100
        );

    updatePowerUI();
});

canvas.addEventListener("pointerup",e=>{

    if(!dragging) return;

    dragging=false;
    charging=false;

    shoot();
});

canvas.addEventListener("pointercancel",()=>{

    dragging=false;
    charging=false;

});

/* ================= BUTTONS ================= */

document.getElementById("startBtn")
.addEventListener("click",startGame);

document.getElementById("rankBtn")
.addEventListener("click",showRanking);

document.getElementById("closeRank")
.addEventListener("click",()=>{

    document.getElementById("rankingOverlay").style.display="none";
    document.getElementById("startOverlay").style.display="flex";

});

document.getElementById("againBtn")
.addEventListener("click",()=>{

    document.getElementById("resultOverlay").style.display="none";

    startGame();

});

document.getElementById("resultRankBtn")
.addEventListener("click",showRanking);

/* ================= ENTER ================= */

document.getElementById("playerName")
.addEventListener("keydown",e=>{

    if(e.key==="Enter"){
        startGame();
    }

});

/* ================= INITIAL ================= */

updateDifficulty();
resetBall();
updateHUD();

</script>
